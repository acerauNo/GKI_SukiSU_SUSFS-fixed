1|name: GKI Kernel Build
2|permissions:
3|  contents: write # Allow writing to repository contents (for pushing tags)
4|  actions: write # Allows triggering actions
5|
6|on:
7|  workflow_call: # This allows this workflow to be called from another workflow
8|    inputs:
9|      make_release:
10|        required: true
11|        type: boolean
12|        default: true
13|      android_version:
14|        required: true
15|        type: string
16|      kernel_version:
17|        required: true
18|        type: string
19|      sub_level:
20|        required: true
21|        type: string
22|      os_patch_level:
23|        required: true
24|        type: string
25|      kernelsu_variant:
26|        required: true
27|        type: string
28|      kernelsu_branch:
29|        required: true
30|        type: string
31|      kernelsu_branch_other:
32|        required: false
33|        type: string
34|      revision:
35|        required: false
36|        type: string
37|
38|jobs:
39|  build-kernel-kernelsu-susfs:
40|    runs-on: ubuntu-latest
41|    env:
42|      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
43|      CCACHE_NOHASHDIR: "true"
44|      CCACHE_HARDLINK: "true"
45|      ZRAM: "true"
46|
47|    steps:
48|      - name: Maximize build space
49|        uses: easimon/maximize-build-space@master
50|        with:
51|          root-reserve-mb: 8192
52|          temp-reserve-mb: 2048
53|          swap-size-mb: 8192
54|          remove-dotnet: "true"
55|          remove-android: "true"
56|          remove-haskell: "true"
57|          remove-codeql: "true"
58|
59|      - name: Set CONFIG Environment Variable
60|        run: |
61|          # Set CONFIG dynamically based on inputs values
62|          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
63|
64|          # Set CONFIG as an environment variable for future steps
65|          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
66|
67|          echo "CONFIG set to: $CONFIG"
68|
69|      # Install ccache
70|      - name: Install ccache
71|        run: sudo apt update && sudo apt upgrade -y && sudo apt install -y ccache python3 git curl
72|
73|      - name: Set up ccache
74|        run: |
75|          mkdir -p ~/.cache/bazel # Ensure the directory exists
76|          ccache --version
77|          ccache --max-size=2G
78|          ccache --set-config=compression=true
79|          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
80|
81|      - name: Restore ccache from cache
82|        uses: actions/cache@v4
83|        with:
84|          path: ~/.ccache
85|          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
86|          restore-keys: |
87|            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-
88|
89|      - name: Cache toolchain
90|        id: cache-toolchain
91|        uses: actions/cache@v4
92|        with:
93|          path: |
94|            kernel-build-tools
95|            mkbootimg
96|          key: toolchain-${{ runner.os }}-v1
97|
98|      # Step 2: Download toolchain if cache was not found
99|      - name: Download toolchain (if cache not found)
100|        if: steps.cache-toolchain.outputs.cache-hit != 'true'
101|        run: |
102|          AOSP_MIRROR=https://android.googlesource.com
103|          BRANCH=main-kernel-build-2024
104|          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
105|          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg
106|
107|      - name: Set environment variables
108|        run: |
109|          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
110|          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
111|          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
112|
113|      - name: Set boot sign key
114|        env:
115|          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
116|        run: |
117|          if [ ! -z "$BOOT_SIGN_KEY" ]; then
118|            echo "$BOOT_SIGN_KEY" > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
119|            echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
120|          else
121|            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
122|            echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
123|          fi
124|
125|      - name: Install Repo
126|        run: |
127|          # Install dependencies
128|          mkdir -p ./git-repo
129|          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
130|          chmod a+rx ./git-repo/repo
131|          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV
132|
133|      - name: Clone AnyKernel3 and Other Dependencies
134|        run: |
135|          echo "Cloning AnyKernel3 and other dependencies..."
136|
137|          # Define the branch names using the inputs values
138|          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
139|
140|          # Debug print the branches
141|          echo "Using branch for SUSFS: $SUSFS_BRANCH"
142|
143|          # Clone repositories using the branch names
144|          git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH"
145|          # if [ "${{ inputs.kernel_version }}" == "6.1" ]; then
146|          #   echo "Reverting patch..."
147|          #   cd susfs4ksu
148|          #   git checkout 0e19a05277d28182c7b653580117145c53e69e92
149|          #   cd ..
150|          # fi
151|          git clone https://github.com/ShirkNeko/SukiSU_patch.git
152|          git clone https://github.com/MiRinChan/AnyKernel3.git
153|
154|      - name: Set CONFIG Environment Variable
155|        run: |
156|          # Set CONFIG dynamically based on inputs values
157|          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
158|
159|          # Set CONFIG as an environment variable for future steps
160|          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
161|
162|          echo "CONFIG set to: $CONFIG"
163|
164|      - name: Initialize and Sync Kernel Source
165|        run: |
166|          echo "Creating folder for configuration: $CONFIG..."
167|          mkdir -p "$CONFIG"
168|          cd "$CONFIG"
169|
170|          # Initialize and sync kernel source
171|          echo "Initializing and syncing kernel source..."
172|          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
173|          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
174|
175|          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
176|          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
177|
178|          # Check if branch is deprecated
179|          if grep -q deprecated <<< $REMOTE_BRANCH; then
180|            echo "Found deprecated branch: $FORMATTED_BRANCH"
181|            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
182|          fi
183|
184|          # Sync repo and apply patches
185|          $REPO --version
186|          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
187|      - name: Determine the branch for KernelSU
188|        run: |
189|          if [[ "${{ inputs.kernelsu_branch }}" == "Stable" && ( "${{ inputs.kernelsu_variant }}" == "SukiSU" ) ]]; then
190|              echo "BRANCH=-s builtin" >> $GITHUB_ENV
191|          elif [[ "${{ inputs.kernelsu_branch }}" == "Dev" && ( "${{ inputs.kernelsu_variant }}" == "SukiSU" ) ]]; then
192|              if [[ "${{ inputs.kernel_version }}" == "5.10" ]]; then
193|                  echo "BRANCH=-s builtin" >> $GITHUB_ENV
194|              else
195|                  echo "BRANCH=-s builtin" >> $GITHUB_ENV
196|              fi
197|          elif [[ "${{ inputs.kernelsu_branch }}" == "Other" && -n "${{ inputs.kernelsu_branch_other }}" ]]; then
198|            echo "BRANCH=-s ${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
199|          else
200|            echo "Error: Custom branch not provided for 'Other'" >&2
201|            exit 1
202|          fi
203|
204|      - name: Add BBG
205|        shell: bash
206|        run: |
207|          set -euo pipefail
208|          cd "$CONFIG"
209|          echo "Adding BBG..."
210|          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
211|          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
212|          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' common/security/Kconfig
213|
214|      - name: Add KernelSU
215|        run: |
216|          echo "Changing to configuration directory: $CONFIG..."
217|          cd "$CONFIG"
218|          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
219|            echo "Adding current SukiSU Ultra..."
220|            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
221|          fi
222|
223|      - name: Apply SUSFS Patches for SukiSU (hard fail)
224|        run: |
225|          set -euo pipefail
226|          echo "Changing to configuration directory: $CONFIG..."
227|          cd "$CONFIG"
228|
229|          echo "Applying current SUSFS kernel files and integration patches..."
230|          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
231|          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
232|          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
233|
234|          if [ "${{ inputs.kernelsu_variant }}" != "SukiSU" ]; then
235|            echo "Invalid KernelSU variant selected!"
236|            exit 1
237|          fi
238|
239|          cd KernelSU
240|          patch --forward --batch -p1 < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
241|
242|          cd ../common
243|          patch --forward --batch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch
244|
245|          grep -q 'config KSU_SUSFS' ../KernelSU/kernel/Kconfig
246|          grep -q 'susfs.o' fs/Makefile
247|          test -s fs/susfs.c
248|          test -s include/linux/susfs.h
249|          echo "SUSFS source integration verified."
250|
251|      - name: Apply New Hooks Patches
252|        run: |
253|          echo "Changing to configuration directory: $CONFIG..."
254|          cd "$CONFIG/common"
255|
256|          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
257|            echo "Applying hooks for SukiSU..."
258|            cp ../../SukiSU_patch/hooks/scope_min_manual_hooks_v1.6.patch ./
259|            patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch
260|          fi
